<app-dialog-wrapper>
  <div class="content">
    <form [formGroup]="upsertTransactionForm" class="form">
      <div class="form__content">
        <div class="form__content-field">
          <app-dropdown [size]="DropdownSize.Wide" [options]="[]" />
        </div>

        <div class="form__content-field">
          <app-input
            type="number"
            label="Total Price"
            placeholder="Please, enter total price"
            icon="icon-dollar-sign"
          />
        </div>
      </div>
    </form>
  </div>

  <div footer class="footer">
    <app-button
      [size]="ButtonSize.Wide"
      [severity]="ButtonSeverity.Secondary"
      (buttonClick)="closeDialog()"
    >
      Cancel
    </app-button>

    <app-button [size]="ButtonSize.Wide" (buttonClick)="submitForm()">
      Save
    </app-button>
  </div>
</app-dialog-wrapper>
